stages:
  - deploy

deploy_to_stage:
  stage: deploy
  tags:
    - shell
  only:
    - develop
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY_STAGE" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SSH_HOST_STAGE" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ssh -o StrictHostKeyChecking=no "$SSH_USER_STAGE@$SSH_HOST_STAGE" "CI_COMMIT_REF_NAME='$CI_COMMIT_REF_NAME' CI_COMMIT_SHA='$CI_COMMIT_SHA' bash -s" << 'REMOTESCRIPT'
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      nvm use 20

      export NODE_OPTIONS="--max-old-space-size=4096"

      cd ~/mdmlabsrmm/web-tactical/

      echo "🌐 Resetting working tree to GitLab commit ${CI_COMMIT_SHA}..."
      mkdir -p ~/.ssh
      ssh-keyscan -p 8822 -H gitlab.it-laborato.ru >> ~/.ssh/known_hosts 2>/dev/null || true
      git remote set-url origin "ssh://git@gitlab.it-laborato.ru:8822/mdm/mdmlabs-frontend.git"
      git fetch --prune origin "$CI_COMMIT_REF_NAME"
      git checkout -B "$CI_COMMIT_REF_NAME" "origin/$CI_COMMIT_REF_NAME"
      git reset --hard "$CI_COMMIT_SHA"
      test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      git clean -fd

      mkdir -p dist

      echo "📦 Installing dependencies..."
      npm install --legacy-peer-deps

      echo "🔧 Generating proto files..."
      npm run proto:generate

      echo "🏗️ Building project..."
      npm run build

      test -f dist/index.html
      echo "✅ dist/ refreshed at $(stat -c %y dist/index.html)"

      cd ~/mdmlabsrmm/
      echo "🐳 Building Docker image..."
      docker build --pull --no-cache -t "mdmlabs-frontend" -f "docker/containers/mdmlabs-frontend/dockerfile" .
      echo "🛑 Stopping frontend container..."
      docker stop mdmlabs-frontend || true
      echo "🗑️ Removing frontend container..."
      docker rm mdmlabs-frontend || true
      echo "🚀 Starting new frontend container..."
      cd ~/mdmlabsrmm/docker/
      docker compose up -d mdmlabs-frontend
      REMOTESCRIPT
