stages:
  - deploy

deploy_to_stage:
  stage: deploy
  tags:
    - shell
  only:
    - develop
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY_STAGE" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SSH_HOST_STAGE" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -euo pipefail

      echo "📤 Syncing GitLab checkout ${CI_COMMIT_SHA} to stage..."
      ssh -o StrictHostKeyChecking=no "$SSH_USER_STAGE@$SSH_HOST_STAGE" << 'REMOTEPREP'
      set -e
      mkdir -p ~/mdmlabsrmm/web-tactical
      find ~/mdmlabsrmm/web-tactical -mindepth 1 -maxdepth 1 ! -name node_modules -exec rm -rf {} +
      REMOTEPREP

      tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.quasar --exclude=.DS_Store -czf - . \
        | ssh -o StrictHostKeyChecking=no "$SSH_USER_STAGE@$SSH_HOST_STAGE" 'tar -xzf - -C ~/mdmlabsrmm/web-tactical'

      ssh -o StrictHostKeyChecking=no "$SSH_USER_STAGE@$SSH_HOST_STAGE" "CI_COMMIT_SHA='$CI_COMMIT_SHA' bash -s" << 'REMOTESCRIPT'
      set -euo pipefail
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      nvm use 20

      export NODE_OPTIONS="--max-old-space-size=4096"

      cd ~/mdmlabsrmm/web-tactical/

      echo "🌐 Building synced GitLab commit ${CI_COMMIT_SHA}..."
      printf "%s\n" "$CI_COMMIT_SHA" > .deployed-gitlab-sha

      mkdir -p dist

      echo "📦 Installing dependencies..."
      npm install --legacy-peer-deps

      echo "🔧 Generating proto files..."
      npm run proto:generate

      echo "🏗️ Building project..."
      npm run build

      test -f dist/index.html
      echo "✅ dist/ refreshed at $(stat -c %y dist/index.html)"

      cd ~/mdmlabsrmm/
      echo "🐳 Building Docker image..."
      docker build --pull --no-cache -t "mdmlabs-frontend" -f "docker/containers/mdmlabs-frontend/dockerfile" .
      echo "🛑 Stopping frontend container..."
      docker stop mdmlabs-frontend || true
      echo "🗑️ Removing frontend container..."
      docker rm mdmlabs-frontend || true
      echo "🚀 Starting new frontend container..."
      cd ~/mdmlabsrmm/docker/
      docker compose up -d mdmlabs-frontend
      REMOTESCRIPT
