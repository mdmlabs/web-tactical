name: Deploy to Server (Develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          
          cd ~/mdmlabsrmm/web-tactical/

          echo "🌐 Pulling latest changes..."
          git pull

          echo "📦 Running build..."
          npm install --legacy-peer-deps
          npm run proto:generate


          echo "Appending exports into operator_pb.js..."
          cat << 'EOF2' >> src/generated/operator_pb.js
          export {
            ListAgentsRequest,
            ListAgentsResponse,
            GetAgentRequest,
            AgentDetails,
            ListUsersForAgentRequest,
            ListUsersForAgentResponse,
            ListUserGroupsForAgentRequest,
            ListUserGroupsForAgentResponse,
            ListAdmxFilesRequest,
            ListAdmxFilesResponse,
            GetAdmxSnapshotRequest,
            AdmxSnapshot,
            ImportAdmxZipRequest,
            ImportAdmxResponse,
            ImportAdmxFileRequest,
            ListPoliciesRequest,
            ListPoliciesResponse,
            GetPolicyRequest,
            PolicyDescriptor,
            ListPoliciesGroupedByScopeRequest,
            ListPoliciesGroupedByScopeResponse,
            GetCategoryTreeRequest,
            GetCategoryTreeResponse,
            GetPoliciesByCategoryRequest,
            GetPoliciesByCategoryResponse,
            GetPoliciesByAdmxRequest,
            GetPoliciesByAdmxResponse,
            GetPolicyDetailsRequest,
            PolicyDetails,
            AssignPolicyRequest,
            AssignPolicyResponse,
            RemovePolicyRequest,
            RemovePolicyResponse,
            GetEffectivePoliciesRequest,
            GetEffectivePoliciesResponse,
            GetAssignmentsRequest,
            GetAssignmentsResponse
          };
          EOF2



          npm run build
          
          cd ~/mdmlabsrmm/

          docker build --pull --no-cache -t "mdmlabs-frontend" -f "docker/containers/mdmlabs-frontend/dockerfile" .

          echo "🛑 Stopping frontend container..."
          docker stop mdmlabs-frontend || true

          echo "🗑 Removing frontend container..."
          docker rm mdmlabs-frontend || true

          echo "🚀 Starting new frontend container..."
          cd ~/mdmlabsrmm/docker/
          docker compose up -d mdmlabs-frontend
          
          EOF
