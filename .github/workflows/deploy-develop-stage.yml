name: Deploy to Server (Develop)
on:
  push:
    branches:
      - develop
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_STAGE }}
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER_STAGE }}@${{ secrets.SSH_HOST_STAGE }} << 'EOF'
          # Fail fast on any error so we never rebuild Docker over a stale dist/.
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 20

          # Vite + jsPDF can blow past Node's default 2 GB heap during the
          # production bundle step. 4 GB has plenty of headroom on the box.
          export NODE_OPTIONS="--max-old-space-size=4096"

          node -v
          npm -v

          cd ~/mdmlabsrmm/web-tactical/

          DEPLOY_BRANCH="${{ github.ref_name }}"
          DEPLOY_SHA="${{ github.sha }}"
          DEPLOY_REMOTE_URL="https://github.com/mdmlabs/web-tactical.git"

          echo "🌐 Resetting working tree to GitHub ${DEPLOY_BRANCH}@${DEPLOY_SHA}..."
          # Hard reset prevents `git pull` from aborting on local lock-file
          # drift. Force the server checkout to the GitHub ref that triggered
          # this workflow instead of trusting the server-side origin/branch.
          git remote set-url origin "$DEPLOY_REMOTE_URL"
          git fetch --prune origin "$DEPLOY_BRANCH"
          git reset --hard "$DEPLOY_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

          echo "Just in case"
          mkdir -p dist

          echo "📦 Installing dependencies..."
          npm install --legacy-peer-deps

          echo "🔧 Generating proto files..."
          npm run proto:generate

          echo "🏗️ Building project..."
          npm run build

          # Sanity check — bail if the build silently failed.
          test -f dist/index.html
          echo "✅ dist/ refreshed at $(stat -c %y dist/index.html)"

          cd ~/mdmlabsrmm/
          echo "🐳 Building Docker image..."
          docker build --pull --no-cache -t "mdmlabs-frontend" -f "docker/containers/mdmlabs-frontend/dockerfile" .
          echo "🛑 Stopping frontend container..."
          docker stop mdmlabs-frontend || true
          echo "🗑️ Removing frontend container..."
          docker rm mdmlabs-frontend || true
          echo "🚀 Starting new frontend container..."
          cd ~/mdmlabsrmm/docker/
          docker compose up -d mdmlabs-frontend

          EOF
