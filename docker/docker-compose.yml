version: "3.8"

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/containers/mdmlabs-frontend/Dockerfile
      args:
        PROTOC_VERSION: 25.1
        GRPC_WEB_VERSION: 1.5.0
    image: mdmlabs-frontend:latest
    container_name: mdmlabs-frontend
    ports:
      - "8080:8080"
    environment:
      - API_URL=${API_URL:-https://api.example.com}
      - GRPC_API_URL=${GRPC_API_URL:-https://grpc.example.com}
      - APP_VERSION=${APP_VERSION:-0.101.56}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - mdmlabs-network

networks:
  mdmlabs-network:
    driver: bridge
